<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>항원-항체 반응의 특이성</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f0f4f8;
            --panel: #ffffff;
            --accent: #2d6a4f;
            --accent2: #52b788;
            --antibody: #7c6ae6;
            --antibody-deep: #5a4fcf;
            --antibody-light: #ede9fe;
            --antigen: #e07b39;
            --antigen-light: #fef3e2;
            --border: #d1dde8;
            --text: #1e293b;
            --sub: #64748b;
            --success: #16a34a;
            --error: #dc2626;
            --shadow: 0 4px 20px rgba(0,0,0,0.10);
        }

        html, body {
            min-height: 100%;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        header h1 { font-size: 17px; font-weight: 900; letter-spacing: -0.5px; }
        header p { font-size: 11px; opacity: 0.8; margin-top: 2px; }
        .progress-badge {
            background: rgba(255,255,255,0.2);
            border: 1.5px solid rgba(255,255,255,0.4);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            grid-template-rows: 1fr auto;
            gap: 0;
            overflow: visible;
            min-height: 0;
        }

        .reaction-area {
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: visible;
            min-width: 0;
        }
        .reaction-area-header {
            padding: 10px 16px 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .section-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; }

        .antigen-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            padding: 10px 12px;
            flex: 1;
            overflow: visible;
            align-content: start;
        }

        .antigen-cell {
            border: 2px dashed var(--border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 108px;
            background: #f8fafc;
            transition: all 0.25s ease;
            position: relative;
            padding: 6px;
        }
        .antigen-cell.drag-over {
            border-color: var(--accent2);
            background: #ecfdf5;
            transform: scale(1.04);
            box-shadow: 0 0 0 3px rgba(82,183,136,0.25);
        }
        .antigen-cell.matched {
            border-color: #86efac;
            border-style: solid;
            background: linear-gradient(180deg, #f7fff9 0%, #f0fdf4 100%);
        }
        .antigen-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--sub);
            letter-spacing: 0.5px;
        }

        .answer-box {
            grid-column: 1 / 2;
            background: #f8fafc;
            border-top: 1.5px solid var(--border);
            border-right: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }
        .answer-question {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }
        .answer-question span {
            color: var(--accent);
            font-size: 20px;
            font-weight: 900;
        }
        .answer-controls { display: flex; align-items: center; gap: 8px; }
        .answer-input {
            width: 60px;
            padding: 7px 10px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .answer-input:focus { border-color: var(--accent2); }
        .answer-input.error { border-color: var(--error); background: #fef2f2; }
        .btn-check {
            padding: 7px 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-check:hover:not(:disabled) { background: #1b4332; }
        .btn-check:disabled { background: #cbd5e1; cursor: not-allowed; }
        .feedback {
            font-size: 12px;
            font-weight: 700;
            min-width: 180px;
        }
        .feedback.info { color: var(--sub); }
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }
        .feedback.match { color: var(--accent2); }

        .antibody-panel {
            grid-row: 1 / 3;
            grid-column: 2 / 3;
            background: var(--antibody-light);
            border-left: 1.5px solid #c4b5fd;
            display: flex;
            flex-direction: column;
            overflow: visible;
            min-width: 0;
        }
        .antibody-panel-header {
            padding: 10px 14px 6px;
            border-bottom: 1px solid #c4b5fd;
            flex-shrink: 0;
        }
        .antibody-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }
        .antibody-card {
            background: white;
            border-radius: 12px;
            border: 2px solid #ddd6fe;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            transition: all 0.25s ease;
            cursor: not-allowed;
            gap: 4px;
        }
        .antibody-card.active {
            border-color: var(--antibody-deep);
            box-shadow: 0 0 0 3px rgba(90,79,207,0.2), 0 4px 16px rgba(90,79,207,0.15);
            cursor: grab;
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        .antibody-card.active:active { cursor: grabbing; }
        .antibody-card.matched {
            opacity: 0.2;
            filter: grayscale(1);
            pointer-events: none;
        }
        .antibody-card.inactive { opacity: 0.55; }
        @keyframes glow {
            from { box-shadow: 0 0 0 3px rgba(90,79,207,0.2), 0 4px 16px rgba(90,79,207,0.1); }
            to   { box-shadow: 0 0 0 5px rgba(90,79,207,0.35), 0 4px 24px rgba(90,79,207,0.25); }
        }
        .ab-number {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: #ede9fe;
            color: var(--antibody-deep);
            transition: all 0.3s;
        }
        .ab-number.active-label { background: var(--antibody-deep); color: white; }

        .reset-bar {
            grid-column: 1 / 3;
            background: #f1f5f9;
            border-top: 1px solid var(--border);
            padding: 6px 16px;
            display: flex;
            justify-content: flex-end;
        }
        .btn-reset {
            background: none;
            border: none;
            color: var(--sub);
            font-size: 12px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .btn-reset:hover { color: var(--text); }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.7);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .overlay-card {
            background: white;
            border-radius: 24px;
            padding: 40px 36px;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }
        .overlay-icon {
            width: 72px; height: 72px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
        }
        .overlay h2 { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
        .overlay p { color: var(--sub); font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
        .overlay-highlight { color: var(--accent); font-weight: 700; }
        .btn-restart {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2d6a4f, #52b788);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-restart:hover { opacity: 0.9; }

        @keyframes bindSlide {
            0%   { transform: translateY(14px) scale(0.96); opacity: 0; }
            65%  { transform: translateY(-4px) scale(1.02); opacity: 1; }
            100% { transform: translateY(0px) scale(1); opacity: 1; }
        }
        @keyframes pulseRing {
            0%   { transform: scale(0.55); opacity: 0.9; }
            100% { transform: scale(1.55); opacity: 0; }
        }
        @keyframes shimmer {
            0%,100% { opacity: 0.28; }
            50% { opacity: 0.95; }
        }
        .bind-anim { animation: bindSlide 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        .pulse-ring { animation: pulseRing 0.9s ease-out infinite; transform-origin: center; }
        .shimmer { animation: shimmer 1.2s ease-in-out infinite; }

        @media (max-width: 900px) {
            header {
                flex-wrap: wrap;
                align-items: flex-start;
                gap: 8px;
            }
            main {
                grid-template-columns: minmax(0, 1fr) 190px;
            }
            .antigen-cell {
                min-height: 100px;
            }
            .feedback {
                min-width: 0;
            }
        }

        @media (max-width: 720px) {
            body {
                height: auto;
            }
            header {
                padding: 12px 14px;
            }
            header h1 {
                font-size: 16px;
            }
            header p {
                font-size: 10px;
            }
            main {
                display: block;
            }
            .reaction-area {
                border-right: none;
            }
            .antigen-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                overflow: visible;
            }
            .answer-box {
                grid-column: auto;
                border-right: none;
                padding: 12px 14px;
                flex-direction: column;
                align-items: stretch;
            }
            .answer-question {
                font-size: 14px;
                line-height: 1.5;
            }
            .answer-controls {
                width: 100%;
                justify-content: flex-start;
            }
            .feedback {
                min-width: 0;
                line-height: 1.45;
            }
            .antibody-panel {
                grid-row: auto;
                grid-column: auto;
                border-left: none;
                border-top: 1.5px solid #c4b5fd;
            }
            .antibody-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                overflow: visible;
            }
            .reset-bar {
                grid-column: auto;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .antigen-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                padding: 8px;
            }
            .antigen-cell {
                min-height: 96px;
                border-radius: 12px;
            }
            .antibody-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                padding: 8px;
            }
            .answer-input {
                width: 56px;
            }
            .btn-check {
                padding: 8px 14px;
            }
            .overlay-card {
                margin: 0 12px;
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>항원-항체 반응의 특이성 시뮬레이터</h1>
        <p>항원의 구조에 맞는 항체 번호를 입력하고, 활성화된 항체를 드래그하여 결합하세요</p>
    </div>
    <div class="progress-badge" id="progress-badge">완료: 0 / 9</div>
</header>

<main>
    <div class="reaction-area">
        <div class="reaction-area-header">
            <div class="section-dot" style="background:#52b788"></div>
            <div class="section-title">반응 영역 — 항원(Antigen)</div>
        </div>
        <div class="antigen-grid" id="antigen-grid"></div>
    </div>

    <div class="answer-box" id="answer-box">
        <div class="answer-question" id="question-text">항원 <span id="target-label">A</span>에 결합할 항체는 몇 번인가요?</div>
        <div class="answer-controls">
            <input type="number" class="answer-input" id="answer-input" min="1" max="9" placeholder="#" />
            <button class="btn-check" id="btn-check">확인</button>
        </div>
        <div class="feedback info" id="feedback">번호를 입력하고 확인을 누르세요 (1~9)</div>
    </div>

    <div class="antibody-panel">
        <div class="antibody-panel-header">
            <div style="display:flex;align-items:center;gap:8px">
                <div class="section-dot" style="background:#5a4fcf"></div>
                <div class="section-title" style="color:#5a4fcf">항체 보관함 (Antibody)</div>
            </div>
        </div>
        <div class="antibody-grid" id="antibody-grid"></div>
    </div>
</main>

<script>
const SHAPES = [
    { id:1, label:'A', spike:'round'    },
    { id:2, label:'B', spike:'triangle' },
    { id:3, label:'C', spike:'star'     },
    { id:4, label:'D', spike:'diamond'  },
    { id:5, label:'E', spike:'rect'     },
    { id:6, label:'F', spike:'cross'    },
    { id:7, label:'G', spike:'hex'      },
    { id:8, label:'H', spike:'arrow'    },
    { id:9, label:'I', spike:'crescent' },
];

function spikeShape(type, scale=1) {
    const s = scale;
    switch(type) {
        case 'round':    return `<circle r="${6*s}" fill="currentColor"/>`;
        case 'triangle': return `<polygon points="0,${-8*s} ${7*s},${6*s} ${-7*s},${6*s}" fill="currentColor"/>`;
        case 'star':     return `<path d="M0,${-9*s} L${2.5*s},${-3*s} L${8*s},${-3*s} L${4*s},${1.5*s} L${5.5*s},${7*s} L0,${3.5*s} L${-5.5*s},${7*s} L${-4*s},${1.5*s} L${-8*s},${-3*s} L${-2.5*s},${-3*s}Z" fill="currentColor"/>`;
        case 'diamond':  return `<polygon points="0,${-9*s} ${6*s},0 0,${9*s} ${-6*s},0" fill="currentColor"/>`;
        case 'rect':     return `<rect x="${-5*s}" y="${-8*s}" width="${10*s}" height="${16*s}" rx="${2*s}" fill="currentColor"/>`;
        case 'cross':    return `<path d="M${-3*s},${-9*s}h${6*s}v${6*s}h${6*s}v${6*s}h${-6*s}v${6*s}h${-6*s}v${-6*s}h${-6*s}v${-6*s}h${6*s}z" fill="currentColor"/>`;
        case 'hex':      return `<polygon points="0,${-9*s} ${8*s},${-4.5*s} ${8*s},${4.5*s} 0,${9*s} ${-8*s},${4.5*s} ${-8*s},${-4.5*s}" fill="currentColor"/>`;
        case 'arrow':    return `<polygon points="0,${-9*s} ${8*s},${0} 0,${9*s} 0,${3*s} ${-7*s},${3*s} ${-7*s},${-3*s} 0,${-3*s}" fill="currentColor"/>`;
        case 'crescent': return `<path d="M${5*s},${-7*s} A${9*s},${9*s} 0 1 0 ${5*s},${7*s} A${5*s},${5*s} 0 1 1 ${5*s},${-7*s}Z" fill="currentColor"/>`;
        default:         return `<circle r="${6*s}" fill="currentColor"/>`;
    }
}

function antigenSVG(spike, matched=false) {
    const bodyColor = matched ? '#fbbf24' : '#f59e0b';
    const bodyHL    = matched ? '#fde68a' : '#fcd34d';
    const spikeColor = '#d97706';
    const spikes = [
        { x:0, y:-26, r:0 },
        { x:26, y:0, r:90 },
        { x:0, y:26, r:180 },
        { x:-26, y:0, r:270 }
    ];
    const spikesSVG = spikes.map(p =>
        `<g transform="translate(${p.x},${p.y}) rotate(${p.r})" style="color:${spikeColor}">${spikeShape(spike, 0.56)}</g>`
    ).join('');

    return `<svg viewBox="-38 -38 76 76" xmlns="http://www.w3.org/2000/svg" width="70" height="70">
        <defs>
            <radialGradient id="ag-g-${spike}" cx="35%" cy="30%" r="65%">
                <stop offset="0%" stop-color="${bodyHL}"/>
                <stop offset="100%" stop-color="${bodyColor}"/>
            </radialGradient>
            <filter id="ag-sh-${spike}"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.18)"/></filter>
        </defs>
        ${spikesSVG}
        <circle r="21" fill="url(#ag-g-${spike})" filter="url(#ag-sh-${spike})" stroke="#d97706" stroke-width="1.3"/>
        <circle r="9" cx="-5" cy="-6" fill="${bodyHL}" opacity="0.42"/>
    </svg>`;
}

function antibodySVG(spike, revealed=false, active=false) {
    const abColor  = active ? '#5b52d7' : '#7c6ae6';
    const abDeep   = active ? '#4f46e5' : '#5a4fcf';
    const abLight  = active ? '#dbe4ff' : '#ede9fe';
    const slotGlow = revealed ? '#34d399' : '#ffffff';

    const holeL = `<g transform="translate(-17,-37) rotate(180)" style="color:white" opacity="0.96">${spikeShape(spike, 0.65)}</g>`;
    const holeR = `<g transform="translate(17,-37) rotate(180)" style="color:white" opacity="0.96">${spikeShape(spike, 0.65)}</g>`;

    return `<svg viewBox="-34 -56 68 96" xmlns="http://www.w3.org/2000/svg" width="56" height="82">
        <defs>
            <linearGradient id="ab-g-${spike}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${abLight}"/>
                <stop offset="100%" stop-color="${abColor}"/>
            </linearGradient>
            <filter id="ab-sh-${spike}"><feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="rgba(79,46,229,0.22)"/></filter>
        </defs>

        <path d="M0,30
                 L0,-2
                 L-18,-24
                 L-26,-45
                 L-17,-48
                 L-8,-28
                 L0,-14
                 L8,-28
                 L17,-48
                 L26,-45
                 L18,-24
                 L0,-2 Z"
              fill="url(#ab-g-${spike})" filter="url(#ab-sh-${spike})" stroke="${abDeep}" stroke-width="0.9" stroke-linejoin="round"/>

        <path d="M0,-2 L0,28" stroke="${abDeep}" stroke-width="8.6" stroke-linecap="round" opacity="0.98"/>
        <path d="M0,-12 L-18,-30 L-24,-45" stroke="${abColor}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M0,-12 L18,-30 L24,-45" stroke="${abColor}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <circle cx="-17" cy="-37" r="5.2" fill="${slotGlow}" opacity="${revealed ? '0.22' : '0.1'}"/>
        <circle cx="17" cy="-37" r="5.2" fill="${slotGlow}" opacity="${revealed ? '0.22' : '0.1'}"/>
        ${holeL}
        ${holeR}

        <path d="M-5,8 L-5,18" stroke="rgba(255,255,255,0.55)" stroke-width="1.4"/>
        <path d="M5,8 L5,18" stroke="rgba(255,255,255,0.55)" stroke-width="1.4"/>
    </svg>`;
}

function miniAntigen(spike, x, y, rot=0, scale=1) {
    return `
      <g transform="translate(${x},${y}) rotate(${rot}) scale(${scale})">
        <g transform="translate(0,-16)" style="color:#d97706">${spikeShape(spike, 0.42)}</g>
        <g transform="translate(16,0) rotate(90)" style="color:#d97706">${spikeShape(spike, 0.42)}</g>
        <g transform="translate(0,16) rotate(180)" style="color:#d97706">${spikeShape(spike, 0.42)}</g>
        <g transform="translate(-16,0) rotate(270)" style="color:#d97706">${spikeShape(spike, 0.42)}</g>
        <circle r="13" fill="url(#mini-ag-${spike})" stroke="#d97706" stroke-width="1"/>
        <circle r="5.2" cx="-3" cy="-3.5" fill="#fde68a" opacity="0.46"/>
      </g>`;
}

function antibodyNetwork(spike, dx=0, dy=0, rot=0, scale=1, opacity=0.68) {
    return `
      <g transform="translate(${dx},${dy}) rotate(${rot}) scale(${scale})" opacity="${opacity}">
        <path d="M0,24 L0,-4 L-15,-23 L-22,-40 L-15,-42 L-7,-24 L0,-11 L7,-24 L15,-42 L22,-40 L15,-23 L0,-4 Z"
              fill="none" stroke="#9f96f3" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>`;
}

function complexSVG(spike) {
    return `<svg viewBox="-56 -58 112 138" xmlns="http://www.w3.org/2000/svg" width="82" height="120">
        <defs>
            <radialGradient id="mini-ag-${spike}" cx="35%" cy="30%" r="65%">
                <stop offset="0%" stop-color="#fde68a"/>
                <stop offset="100%" stop-color="#f4b942"/>
            </radialGradient>
            <linearGradient id="cx-ab-${spike}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ddd6fe"/>
                <stop offset="100%" stop-color="#6d5fe6"/>
            </linearGradient>
            <filter id="cx-sh-${spike}"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="rgba(0,0,0,0.18)"/></filter>
        </defs>

        ${antibodyNetwork(spike, -34, 8, -26, 0.95, 0.62)}
        ${antibodyNetwork(spike, 34, 8, 26, 0.95, 0.62)}

        <g class="bind-anim" filter="url(#cx-sh-${spike})">
            <path d="M0,38 L0,4 L-18,-20 L-25,-43 L-16,-46 L-7,-25 L0,-12 L7,-25 L16,-46 L25,-43 L18,-20 L0,4 Z"
                  fill="url(#cx-ab-${spike})" stroke="#5a4fcf" stroke-width="1.1" stroke-linejoin="round"/>
            <path d="M0,-12 L0,38" stroke="#6d5fe6" stroke-width="8.8" stroke-linecap="round"/>
            <path d="M0,-11 L-18,-30 L-24,-44" stroke="#7c6ae6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M0,-11 L18,-30 L24,-44" stroke="#7c6ae6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

            <g transform="translate(-17,-36) rotate(180)" style="color:white" opacity="0.96">${spikeShape(spike, 0.62)}</g>
            <g transform="translate(17,-36) rotate(180)" style="color:white" opacity="0.96">${spikeShape(spike, 0.62)}</g>
        </g>

        ${miniAntigen(spike, -22, -34, -14, 1.08)}
        ${miniAntigen(spike, 22, -34, 14, 1.08)}
        ${miniAntigen(spike, 0, -5, 0, 0.98)}

        <path d="M-7,-33 C-12,-34 -15,-35 -18,-36" stroke="#86efac" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
        <path d="M7,-33 C12,-34 15,-35 18,-36" stroke="#86efac" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>

        <g transform="translate(-17,-36)">
            <circle class="pulse-ring" r="6" fill="none" stroke="#34d399" stroke-width="2.2"/>
            <circle r="3.2" fill="#10b981"/>
        </g>
        <g transform="translate(17,-36)">
            <circle class="pulse-ring" r="6" fill="none" stroke="#34d399" stroke-width="2.2" style="animation-delay:0.18s"/>
            <circle r="3.2" fill="#10b981"/>
        </g>

        <circle cx="0" cy="-5" r="5.5" fill="#bbf7d0" opacity="0.45" class="shimmer"/>
    </svg>`;
}

let shuffledAbs = [];
let currentIdx  = 0;
let matchedIds  = new Set();
let activeAbId  = null;
let dragSrcId   = null;

function initGame() {
    shuffledAbs = [...SHAPES].sort(() => Math.random()-0.5).map((s,i) => ({...s, order: i+1}));
    currentIdx  = 0;
    matchedIds  = new Set();
    activeAbId  = null;

    renderAntigens();
    renderAntibodies();
    updateQuestion();
    setFeedback('번호를 입력하고 확인을 누르세요 (1~9)', 'info');
    document.getElementById('progress-badge').textContent = `완료: 0 / 9`;

    const overlay = document.getElementById('overlay');
    if (overlay) overlay.remove();
}

function renderAntigens() {
    const grid = document.getElementById('antigen-grid');
    grid.innerHTML = '';
    SHAPES.forEach(shape => {
        const cell = document.createElement('div');
        cell.className = `antigen-cell${matchedIds.has(shape.id) ? ' matched' : ''}`;
        cell.dataset.id = shape.id;

        if (matchedIds.has(shape.id)) {
            cell.innerHTML = `${complexSVG(shape.spike)}<div class="antigen-label">결합한 복합체</div>`;
        } else {
            cell.innerHTML = `<div style="display:flex;align-items:center;justify-content:center">${antigenSVG(shape.spike, false)}</div>
                <div class="antigen-label">항원 ${shape.label}</div>`;
        }

        cell.addEventListener('dragover', e => {
            e.preventDefault();
            if (!matchedIds.has(shape.id)) cell.classList.add('drag-over');
        });
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
        cell.addEventListener('drop', e => {
            e.preventDefault();
            cell.classList.remove('drag-over');
            handleDrop(shape.id);
        });

        grid.appendChild(cell);
    });
}

function renderAntibodies() {
    const grid = document.getElementById('antibody-grid');
    grid.innerHTML = '';
    shuffledAbs.forEach(ab => {
        const isMatched  = matchedIds.has(ab.id);
        const isActive   = activeAbId === ab.id;
        const isInactive = !isMatched && !isActive;
        const revealed   = isActive || isMatched;

        const card = document.createElement('div');
        card.className = `antibody-card${isActive ? ' active' : ''}${isMatched ? ' matched' : ''}${isInactive ? ' inactive' : ''}`;

        const svgDiv = document.createElement('div');
        svgDiv.innerHTML = antibodySVG(ab.spike, revealed, isActive);
        card.appendChild(svgDiv);

        const label = document.createElement('div');
        label.className = `ab-number${isActive ? ' active-label' : ''}`;
        label.textContent = revealed ? `항체 ${ab.label}` : `${ab.order}번`;
        card.appendChild(label);

        if (isActive) {
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', e => {
                dragSrcId = ab.id;
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => card.style.opacity='0.4', 0);
            });
            card.addEventListener('dragend', () => { card.style.opacity=''; });
        }

        grid.appendChild(card);
    });
}

function updateQuestion() {
    const isComplete = currentIdx >= SHAPES.length;
    const box = document.getElementById('answer-box');
    if (isComplete) {
        box.innerHTML = `<span style="font-size:16px;font-weight:900;color:#059669">🎉 모든 항원-항체 반응 완료! Fab 부위에 맞는 항원만 결합하고, 항체가 항원을 가교해 응집처럼 보입니다.</span>`;
        showCompleteOverlay();
        return;
    }
    document.getElementById('target-label').textContent = SHAPES[currentIdx].label;
    document.getElementById('progress-badge').textContent = `완료: ${matchedIds.size} / 9`;
    document.getElementById('answer-input').value = '';
    document.getElementById('answer-input').disabled = (activeAbId !== null);
    document.getElementById('btn-check').disabled   = (activeAbId !== null);
}

function setFeedback(msg, type='info') {
    const el = document.getElementById('feedback');
    if (!el) return;
    el.textContent = msg;
    el.className = `feedback ${type}`;
}

document.addEventListener('DOMContentLoaded', () => {
    initGame();

    document.getElementById('btn-check').addEventListener('click', checkAnswer);
    document.getElementById('answer-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') checkAnswer();
    });
});

function checkAnswer() {
    if (currentIdx >= SHAPES.length || activeAbId !== null) return;
    const val = parseInt(document.getElementById('answer-input').value, 10);
    const target = SHAPES[currentIdx];
    const chosen = shuffledAbs.find(a => a.order === val);

    if (!chosen) {
        setFeedback('1~9 사이의 번호를 입력하세요.', 'error');
        flashInput();
        return;
    }

    if (chosen.id === target.id) {
        activeAbId = target.id;
        renderAntibodies();
        document.getElementById('answer-input').disabled = true;
        document.getElementById('btn-check').disabled = true;
        setFeedback('✓ 정답! 활성화된 항체를 드래그하여 항원의 Fab 결합 위치에 결합시키세요.', 'success');
    } else {
        setFeedback('✗ 모양이 맞지 않는 항체입니다. 다시 확인하세요.', 'error');
        flashInput();
    }
}

function flashInput() {
    const inp = document.getElementById('answer-input');
    if (!inp) return;
    inp.classList.add('error');
    setTimeout(() => inp.classList.remove('error'), 600);
}

function handleDrop(targetId) {
    if (dragSrcId === null) return;
    const target = SHAPES[currentIdx];

    if (dragSrcId === target.id && dragSrcId === activeAbId && targetId === target.id) {
        matchedIds.add(target.id);
        activeAbId = null;
        dragSrcId  = null;
        currentIdx++;
        renderAntigens();
        renderAntibodies();
        setFeedback('✓ 항원의 돌기가 항체의 양쪽 Fab 결합부위에 결합했습니다. 가교된 복합체가 형성됩니다.', 'match');
        updateQuestion();
    } else if (targetId !== target.id) {
        setFeedback('✗ 특이성! 이 항원에는 결합할 수 없습니다.', 'error');
    } else {
        setFeedback('✗ 올바른 항체가 아닙니다. 먼저 번호를 입력하세요.', 'error');
    }
    dragSrcId = null;
}

function showCompleteOverlay() {
    const div = document.createElement('div');
    div.id = 'overlay';
    div.className = 'overlay';
    div.innerHTML = `
        <div class="overlay-card">
            <div class="overlay-icon">🔬</div>
            <h2>학습 성공!</h2>
            <p>모든 항원-항체 복합체를 완성했습니다.<br>
            <span class="overlay-highlight">Fab 부위에 맞는 항원만 결합하고,<br>항체가 여러 항원을 가교해 응집처럼 연결됩니다.</span></p>
            <button class="btn-restart" onclick="initGame()">다시 학습하기</button>
        </div>`;
    document.body.appendChild(div);
}
</script>
